# Configuration lives here, not in the code. Values use ${ENV_VAR:default}:
# if the environment variable exists it wins, otherwise the local default is used.
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never   # never expose stack traces to the client

spring:
  application:
    name: oficina-agua-pagos
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gota_db}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
  jpa:
    hibernate:
      # "validate": Hibernate checks the entity matches the table but NEVER changes it.
      # The schema is owned by db/init/01-schema.sql and db/init/03-gota.sql.
      ddl-auto: validate
      naming:
        # Keep the exact table name from @Table; the monolith uses PascalCase ("Pagos").
        # Without this, Hibernate lowercases it to "pagos" and fails on Linux MariaDB.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: true   # didactic: shows the prepared statements in the console. Disable in production.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # After the retries are exhausted the message is rejected and routed to the DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000   # recommended by the bank contract
            read-timeout: 3000

# Datos entregados por el docente para el Banco (override with env vars)
bank:
  name: bank
  base-url: ${BANK_BASE_URL:https://gdsi5lyj34.execute-api.us-east-1.amazonaws.com/prod}
  url: ${bank.base-url}
  api-key: ${BANK_API_KEY:enmimaquinafunciona}
  team-code: ${TEAM_CODE:EQUIPO_A}
  # Empty by default: only used for deterministic tests (SUCCESS, LOST_ACK, ERROR_500...).
  simulation-scenario: ${BANK_SIMULATION_SCENARIO:}

# Property name the OpenAPI generator uses for the x-api-key interceptor.
bankpaymentssimulator:
  security:
    apiKeyAuth:
      key: ${bank.api-key}

# Nombres de las colas
app:
  rabbit:
    exchange: ${RABBIT_EXCHANGE:pagos.exchange}
    queue: ${RABBIT_QUEUE:pagos.queue}
    routing-key: ${RABBIT_ROUTING_KEY:pagos.routing}
    dlq-exchange: ${RABBIT_DLQ_EXCHANGE:pagos.dlx}
    dlq-queue: ${RABBIT_DLQ_QUEUE:pagos.dlq}

springdoc:
  swagger-ui:
    # Swagger UI shows OUR contract (the YAML), not one inferred from the code
    url: /openapi/customers-api.yaml
  api-docs:
    enabled: true
